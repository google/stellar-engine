# Test fixture that mirrors data/tenants/example-tenant.yaml.sample so the
# documented sample stays plan-tested.
tenant_id: acme
descriptive_name: Acme Dev
environment: dev
lifecycle_state: active
contacts:
  security-ops@example.com:
    - SECURITY
    - TECHNICAL
iam:
  roles/browser:
    - group:acme-dev-engineers@example.com
labels:
  cost_center: cc-1001
  owner_team: acme
projects:
  app-0:
    name: dev-acme-app-0
    descriptive_name: Acme Dev App 0
    services:
      - compute.googleapis.com
      - container.googleapis.com
      - logging.googleapis.com
      - monitoring.googleapis.com
      - storage.googleapis.com
    kms_services:
      compute.googleapis.com:
        - us-east4-tenant
      storage.googleapis.com:
        - us-east4-tenant
    shared_vpc_subnets:
      - us-east4/dev-acme-app
      - us-east4/dev-acme-gke
    shared_vpc_network_users:
      - group:acme-dev-engineers@example.com
    shared_vpc_service_agent_iam:
      roles/container.hostServiceAgentUser:
        - $service_agents:container-engine
    iam:
      roles/container.developer:
        - group:acme-dev-engineers@example.com
      roles/viewer:
        - group:acme-dev-auditors@example.com
    service_accounts:
      app-runtime:
        display_name: Acme app runtime service account.
        # Grants on the service account itself may use actAs and Workload
        # Identity roles; project-level iam rejects them. Members use the
        # <prefix>-<project name> project ID (prefix se here).
        iam:
          roles/iam.workloadIdentityUser:
            - serviceAccount:se-dev-acme-app-0.svc.id.goog[acme/app-runtime]
        iam_self_roles:
          - roles/logging.logWriter
          - roles/monitoring.metricWriter
  data-0:
    name: dev-acme-data-0
    descriptive_name: Acme Dev Data 0
    services:
      - bigquery.googleapis.com
      - logging.googleapis.com
      - storage.googleapis.com
    kms_services:
      bigquery.googleapis.com:
        - us-east4-tenant
      storage.googleapis.com:
        - us-east4-tenant
    shared_vpc_subnets:
      - us-east4/dev-acme-data
    shared_vpc_network_users:
      - group:acme-dev-data@example.com
    iam:
      roles/bigquery.dataEditor:
        - group:acme-dev-data@example.com
      roles/bigquery.jobUser:
        - group:acme-dev-data@example.com
