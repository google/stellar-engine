image_factory:
  artifact_registry_repo_id: "acas-rpms"
  base_image: "projects/cis-public/global/images/family/cis-rhel8-stig"
  scanner_rpm_filename: "nessus-scanner-10.12.0-el8.x86_64.rpm"
  sc_rpm_filename: "SecurityCenter-x.x.x-el8.x86_64.rpm"
  build_scanner_image: true
  build_sc_image: false
  # KMS key deletion policy.
  # - Use "ABANDON" for Dev/Test (prevents key destruction on teardown).
  # - Use "PREVENT_DESTROY" for Production to lock key versions from accidental destruction.
  kms_deletion_policy: "PREVENT_DESTROY"
  network: "https://www.googleapis.com/compute/v1/projects/prod-il5-vdss-host/global/networks/vdss-landing-0"
  subnetwork: "https://www.googleapis.com/compute/v1/projects/prod-il5-vdss-host/regions/us-east4/subnetworks/vdms-default"

scanner_deployment:
  enable: true
  enable_confidential_compute: false
  network: "https://www.googleapis.com/compute/v1/projects/prod-il5-vdss-host/global/networks/vdss-landing-0"
  subnetwork: "https://www.googleapis.com/compute/v1/projects/prod-il5-vdss-host/regions/us-east4/subnetworks/vdms-default"
  scanner_configs:
    scanner-1:
      instance_name: "acas-nessus-scanner-01"
      machine_type: "n2d-standard-4"
      boot_disk_size: 100
  iap_source_ranges: ["35.235.240.0/20"]
  securitycenter_source_ranges: ["128.63.27.103/32"]
  scan_target_destination_ranges: ["10.0.0.0/8"]
  admin_ssh_source_ranges: ["128.63.27.98/32, 128.63.27.80/32"]

securitycenter_deployment:
  enable: false
  enable_confidential_compute: false
  network: "https://www.googleapis.com/compute/v1/projects/prod-il5-vdss-host/global/networks/vdss-landing-0"
  subnetwork: "https://www.googleapis.com/compute/v1/projects/prod-il5-vdss-host/regions/us-east4/subnetworks/vdms-default"
  boot_disk_size: 100
  data_disk_size: 500
  iap_source_ranges: ["35.235.240.0/20"]
  sc_mgmt_source_ranges: ["10.0.0.0/8"]
  admin_ssh_source_ranges: ["10.0.0.0/8"]
