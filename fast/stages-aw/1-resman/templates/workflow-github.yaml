name: "FAST ${stage_name} stage"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions: {}

env:
  FAST_WIF_PROVIDER: ${identity_provider}
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock
  TF_VERSION: 1.13.3

jobs:
  fast-plan:
    if: github.event_name == 'pull_request'
    concurrency:
      group: fast-${stage_name}-plan-$${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: $${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    env:
      FAST_SERVICE_ACCOUNT_PLAN: ${service_accounts.plan}
      TF_PROVIDERS_FILE_PLAN: ${tf_providers_files.plan}
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v4

      # Configure SSH key authentication to the modules repository
      - id: ssh-config
        name: Configure SSH authentication
        env:
          CICD_MODULES_KEY: $${{ secrets.CICD_MODULES_KEY }}
        run: |
          umask 077
          if [ -n "$CICD_MODULES_KEY" ]; then
            ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
            ssh-add - <<< "$CICD_MODULES_KEY"
          fi

      # Authenticate read-only plan SA via Workload Identity Federation
      - id: gcp-auth
        name: Authenticate to Google Cloud (plan)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: $${{ env.FAST_WIF_PROVIDER }}
          service_account: $${{ env.FAST_SERVICE_ACCOUNT_PLAN }}
          access_token_lifetime: 900s

      - id: gcp-sdk
        name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Copy read-only Terraform provider file and stage tfvars
      - id: tf-config-provider
        name: Copy Terraform provider file
        run: |
          umask 077
          gcloud storage cp -r \
            "gs://${outputs_bucket}/providers/$${{ env.TF_PROVIDERS_FILE_PLAN }}" ./
          %{~ for f in tf_var_files ~}
          gcloud storage cp -r \
            "gs://${outputs_bucket}/tfvars/${f}" ./
          %{~ endfor ~}

      - id: tf-setup
        name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: $${{ env.TF_VERSION }}

      # Run read-only Terraform init, validate, and plan
      - id: tf-init
        name: Terraform init
        continue-on-error: true
        run: |
          umask 077
          terraform init -input=false -no-color

      - id: tf-validate
        name: Terraform validate
        continue-on-error: true
        run: terraform validate -no-color

      - id: tf-plan
        name: Terraform plan
        continue-on-error: true
        run: |
          umask 077
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode
          plan_exit=$?
          set -e
          if [ "$plan_exit" -eq 0 ] || [ "$plan_exit" -eq 2 ]; then
            exit 0
          fi
          exit "$plan_exit"

      # Post PR comment with Terraform output passed safely through env vars
      - id: pr-comment
        name: Post comment to Pull Request
        continue-on-error: true
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        env:
          PLAN: $${{steps.tf-plan.outputs.stdout}}\n$${{steps.tf-plan.outputs.stderr}}
          VALIDATE: $${{steps.tf-validate.outputs.stdout}}
          TF_INIT_OUTCOME: $${{steps.tf-init.outcome}}
          TF_VALIDATE_OUTCOME: $${{steps.tf-validate.outcome}}
          TF_PLAN_OUTCOME: $${{steps.tf-plan.outcome}}
          WORKFLOW_NAME: $${{github.workflow}}
        with:
          script: |
            const output = `### Terraform Initialization \`$${process.env.TF_INIT_OUTCOME}\`

            ### Terraform Validation \`$${process.env.TF_VALIDATE_OUTCOME}\`

            <details><summary>Validation Output</summary>

            \`\`\`\n
            $${process.env.VALIDATE}
            \`\`\`

            </details>

            ### Terraform Plan \`$${process.env.TF_PLAN_OUTCOME}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            $${process.env.PLAN.split('\n').filter(l => l.match(/^([A-Z\s].*|)$/)).join('\n')}
            \`\`\`

            </details>

            *Pusher: @$${context.actor}, Action: \`$${context.eventName}\`, Workflow: \`$${process.env.WORKFLOW_NAME}\`*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - id: pr-short-comment
        name: Post comment to Pull Request (abbreviated)
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request' && steps.pr-comment.outcome != 'success'
        env:
          TF_INIT_OUTCOME: $${{steps.tf-init.outcome}}
          TF_VALIDATE_OUTCOME: $${{steps.tf-validate.outcome}}
          TF_PLAN_OUTCOME: $${{steps.tf-plan.outcome}}
          WORKFLOW_NAME: $${{github.workflow}}
        with:
          script: |
            const output = `### Terraform Initialization \`$${process.env.TF_INIT_OUTCOME}\`

            ### Terraform Validation \`$${process.env.TF_VALIDATE_OUTCOME}\`

            ### Terraform Plan \`$${process.env.TF_PLAN_OUTCOME}\`

            Plan output is in the action log.

            *Pusher: @$${context.actor}, Action: \`$${context.eventName}\`, Workflow: \`$${process.env.WORKFLOW_NAME}\`*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - id: cleanup
        if: always()
        name: Clean up temporary SSH socket
        run: rm -f "$SSH_AUTH_SOCK"

      # Fail job if init, validate, or plan errored
      - id: check-init
        name: Check init failure
        if: steps.tf-init.outcome != 'success'
        run: exit 1

      - id: check-validate
        name: Check validate failure
        if: steps.tf-validate.outcome != 'success'
        run: exit 1

      - id: check-plan
        name: Check plan failure
        if: steps.tf-plan.outcome != 'success'
        run: exit 1

  fast-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: fast-${stage_name}-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      FAST_SERVICE_ACCOUNT: ${service_accounts.apply}
      TF_PROVIDERS_FILE: ${tf_providers_files.apply}
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v4

      # Configure SSH key authentication to the modules repository
      - id: ssh-config
        name: Configure SSH authentication
        env:
          CICD_MODULES_KEY: $${{ secrets.CICD_MODULES_KEY }}
        run: |
          umask 077
          if [ -n "$CICD_MODULES_KEY" ]; then
            ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
            ssh-add - <<< "$CICD_MODULES_KEY"
          fi

      # Authenticate apply SA via Workload Identity Federation (main push only)
      - id: gcp-auth
        name: Authenticate to Google Cloud (apply)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: $${{ env.FAST_WIF_PROVIDER }}
          service_account: $${{ env.FAST_SERVICE_ACCOUNT }}
          access_token_lifetime: 900s

      - id: gcp-sdk
        name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Copy apply Terraform provider file and stage tfvars
      - id: tf-config-provider
        name: Copy Terraform provider file
        run: |
          umask 077
          gcloud storage cp -r \
            "gs://${outputs_bucket}/providers/$${{ env.TF_PROVIDERS_FILE }}" ./
          %{~ for f in tf_var_files ~}
          gcloud storage cp -r \
            "gs://${outputs_bucket}/tfvars/${f}" ./
          %{~ endfor ~}

      - id: tf-setup
        name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: $${{ env.TF_VERSION }}

      # Run Terraform init, validate, saved plan, and apply
      - id: tf-init
        name: Terraform init
        run: |
          umask 077
          terraform init -input=false -no-color

      - id: tf-validate
        name: Terraform validate
        run: terraform validate -no-color

      - id: tf-plan
        name: Terraform plan
        run: |
          umask 077
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan.binary
          plan_exit=$?
          set -e
          if [ "$plan_exit" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$plan_exit" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$plan_exit"

      - id: tf-apply
        if: steps.tf-plan.outputs.has_changes == 'true'
        name: Terraform apply
        run: |
          umask 077
          terraform apply -input=false -no-color -auto-approve tfplan.binary

      - id: cleanup
        if: always()
        name: Clean up temporary plan and SSH files
        run: rm -f tfplan.binary "$SSH_AUTH_SOCK"
