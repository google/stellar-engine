name: tenantKeyManager
title: "Tenant Cryptographic Key Manager"
description: "Cryptographic officer role for Cloud KMS key rings, crypto keys, and CMEK lifecycle management. Excludes encrypt, decrypt, sign, log payload read, tag binding writes, and IAM policy modification permissions to enforce separation of duties."
stage: "GA"
includedPermissions:
  # Resource discovery
  - resourcemanager.projects.get

  # Cloud KMS key rings (tag binding writes belong to tagEditor)
  - cloudkms.keyRings.create
  - cloudkms.keyRings.get
  - cloudkms.keyRings.getIamPolicy
  - cloudkms.keyRings.list
  - cloudkms.keyRings.listEffectiveTags
  - cloudkms.keyRings.listTagBindings

  # Cloud KMS crypto keys and version lifecycle
  - cloudkms.cryptoKeys.create
  - cloudkms.cryptoKeys.get
  - cloudkms.cryptoKeys.getIamPolicy
  - cloudkms.cryptoKeys.list
  - cloudkms.cryptoKeys.update
  - cloudkms.cryptoKeyVersions.create
  - cloudkms.cryptoKeyVersions.destroy
  - cloudkms.cryptoKeyVersions.get
  - cloudkms.cryptoKeyVersions.list
  - cloudkms.cryptoKeyVersions.restore
  - cloudkms.cryptoKeyVersions.update
  - cloudkms.importJobs.create
  - cloudkms.importJobs.get
  - cloudkms.importJobs.getIamPolicy
  - cloudkms.importJobs.list
  - cloudkms.importJobs.useToImport

  # KMS locations
  - cloudkms.locations.get
  - cloudkms.locations.list
