name: tenantProjectAdmin
title: "Tenant Project Administrator"
description: "Hardened tenant workload administrator for compute, data, CI/CD, and analytics. Excludes central networking, Cloud KMS, organization policy, IAM policy changes, tag binding writes, and service account impersonation, key creation, enable, or undelete."
stage: "GA"
