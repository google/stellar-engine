---
# This list constraint defines the set of external Organizations from which resources
# can be imported, and denies all moves from all other Organizations. By default,
# resources cannot be moved between Organizations. If this constraint is applied to
# a resource, imported resources directly under this resource must be explicitly
# allowed by this constraint. Moves within an Organization are not governed by this
# constraint. The move operation will still require the same IAM permissions as normal
# resource moves. Values specified in allow/deny lists must be in the form:
#   under:organizations/ORGANIZATION_ID.
# SHOULD HAVE
resourcemanager.allowedImportSources:
  rules:
  - allow:
      values:
        - under:organizations/${organization_id}


# This list constraint defines the set of domains that email addresses added to
# Essential Contacts can have. By default, email addresses with any domain can
# be added to Essential Contacts. The allowed/denied list must specify one or
# more domains of the form @dino-runner.darkwolfsolutions.com. If this constraint is active and
# configured with allowed values, only email addresses with a suffix matching
# one of the entries from the list of allowed domains can be added in Essential
# Contacts.This constraint has no effect on updating or removing existing contacts.
# MUST HAVE
essentialcontacts.allowedContactDomains:
  rules:
  - allow:
      values:
        - "@${domain_name}"

# This list constraint defines the set of external Organizations to which resources
# can be moved, and denies all moves to all other Organizations. By default,
# resources cannot be moved between Organizations. If this constraint is applied
# to a resource, the resource can be moved only to Organizations that are explicitly
# allowed by this constraint. Moves within an Organization are not governed by this
# constraint. The move operation will still require the same IAM permissions as normal
# resource moves. Values specified in allow/deny lists must be in the form:
#   under:organizations/ORGANIZATION_ID.
# SHOULD HAVE
resourcemanager.allowedExportDestinations:
  rules:
  - allow:
      values:
        - under:organizations/${organization_id}


# This list constraint defines one or more Cloud Identity or Google Workspace
# customer IDs whose principals can be added to IAM policies. By default, all
# user identities are allowed to be added to IAM policies. Only allowed values
# can be defined in this constraint, denied values are not supported. If this
# constraint is active, only principals that belong to the allowed customer IDs
# can be added to IAM policies.
# MUST HAVE
# Recommendation:
#   This policy is strongly advised. Enforce at the organisation level but be
# cautious of potential issues. When this policy is enforced, even if the user
# has setIamPolicy on the APIs of Google Cloud services, they won't be allowed
# to add users of non-authorized domains. This also blocks the exposure of
# data; for example, a user won't be able to set permission to allUsers or
# authentificatedUsers in Cloud Storage to make the buckets public.
#  use `gcloud organizations list` to query the domain id and/or directory
# customer id.
iam.allowedPolicyMemberDomains:
  rules:
    - allow:
        values:
          - ${customer_id}
%{ for domain in allowed_domains ~}
          - ${domain}
%{ endfor ~}


#Added due to ./import.sh issue

# This list constraint defines the set of domains that email addresses added to
# Essential Contacts can have. By default, email addresses with any domain can
# be added to Essential Contacts. The allowed/denied list must specify one or
# more domains of the form @dino-runner.darkwolfsolutions.com. If this constraint is active and
# configured with allowed values, only email addresses with a suffix matching
# one of the entries from the list of allowed domains can be added in Essential
# Contacts.This constraint has no effect on updating or removing existing contacts.
# MUST HAVE
essentialcontacts.managed.allowedContactDomains:
  rules:
  - enforce: true
    parameters: '{"allowedDomains":["@${domain_name}"]}'


%{ if !contains(["FEDRAMP_MODERATE"], regime) ~}
# Policy: compute.managed.restrictProtocolForwardingCreationForTypes
# Description: Restricts the creation of protocol forwarding.
# You might need to adjust rules based on your exact requirements,
# but 'enforce: true' typically means the default Google-managed behavior is enforced.
compute.managed.restrictProtocolForwardingCreationForTypes:
  rules:
  - enforce: true
%{ endif ~}

# Policy: iam.managed.preventPrivilegedBasicRolesForDefaultServiceAccounts
# Description: Prevents default service accounts from being granted privileged basic roles.
iam.managed.preventPrivilegedBasicRolesForDefaultServiceAccounts:
  rules:
  - enforce: true

# Policy: iam.managed.disableServiceAccountKeyCreation
# Description: Disables the creation of service account keys.
iam.managed.disableServiceAccountKeyCreation:
  rules:
  - enforce: true

# Policy: iam.managed.disableServiceAccountKeyUpload
# Description: Disables the upload of service account keys.
iam.managed.disableServiceAccountKeyUpload:
  rules:
  - enforce: true

# This list constraint defines the set of locations where location-based Google
# Cloud resources can be created. By default, resources can be created in any
# location. Policies for this constraint can specify multi-regions such as asia
# and europe, regions such as us-east1 or europe-west1 as allowed or denied
# locations. Allowing or denying a multi-region does not imply that all included
# sub-locations should also be allowed or denied. For example, if the policy
# denies the us multi-region (which refers to multi-region resources, like some
# storage services), resources can still be created in the regional location
# us-east1. On the other hand, the in:us-locations group contains all locations
# within the us region, and can be used to block every region. We recommend
# using value groups to define your policy. You can specify value groups,
# collections of locations that are curated by Google to provide a simple way
# to define your resource locations. To use value groups in your organization
# policy, prefix your entries with the string in:, followed by the value group.
# For example, to create resources that will only be physically located within
# the US, set in:us-locations in the list of allowed values. If the
# suggested_value field is used in a location policy, it should be a region.
# If the value specified is a region, a UI for a zonal resource may pre-populate
# any zone in that region.
# SHOULD HAVE
%{ if !contains(["FEDRAMP_MODERATE"], regime) ~}
gcp.resourceLocations:
  rules:
  - allow:
      values:
        - in:us-locations
%{ else ~}
gcp.resourceLocations:
  rules:
  - deny:
      values:
        - in:asia-east2-locations
        - in:global
%{ endif ~}
