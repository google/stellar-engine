allow-rfc1918-goto-next:
  description: Delegate internal RFC1918 ingress evaluation to VPC firewall rules.
  priority: 1000
  action: goto_next
  enable_logging: true
  match:
    source_ranges:
      - rfc1918
    layer4_configs:
      - protocol: all

allow-iap-ssh-goto-next:
  description: Delegate IAP SSH ingress evaluation to VPC firewall rules.
  priority: 1001
  action: goto_next
  enable_logging: true
  match:
    source_ranges:
      - iap
    layer4_configs:
      - protocol: tcp
        ports:
          - "22"

allow-healthchecks-goto-next:
  description: Delegate Google Cloud health check ingress evaluation to VPC firewall rules.
  priority: 1002
  action: goto_next
  enable_logging: true
  match:
    source_ranges:
      - healthchecks
    layer4_configs:
      - protocol: tcp
