---
# Opt-in Compute Engine, Dataflow, and Cloud KMS guardrail pack.
# Prefix managed (*.managed.*) keys with "dry_run:" to audit violations before
# live enforcement. Legacy cloudkms.allowedProtectionLevels does not support
# dry-run mode.

# Preview: blocks creation or updates of Compute Engine VMs on non-FIPS machine
# types.
compute.managed.disableNonFIPSMachineTypes:
  rules:
    - enforce: true

# Preview: blocks Compute Engine VMs and instance templates that use the
# deprecated container startup agent (gce-container-declaration metadata).
compute.managed.disableVmsWithContainerStartupAgent:
  rules:
    - enforce: true

# Requires Dataflow worker VMs to use internal IP addresses only.
dataflow.managed.disableUsePublicIps:
  rules:
    - enforce: true

# Blocks Compute Engine VMs from enabling IP forwarding. Exempt dedicated
# firewall, proxy, or NAT appliance folders or VMs using conditional rules.
compute.managed.vmCanIpForward:
  rules:
    - enforce: true

# Restricts new Cloud KMS keys, key versions, and import jobs to Cloud HSM.
# The Org Policy v2 API requires the "is:" prefix on protection level values
# (is:SOFTWARE, is:HSM, is:HSM_SINGLE_TENANT, is:EXTERNAL, is:EXTERNAL_VPC).
# Deny rules are not supported by this constraint.
cloudkms.allowedProtectionLevels:
  rules:
    - allow:
        values:
          - is:HSM
