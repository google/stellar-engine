# Fail-closed ALLOW requiring a private GKE control-plane endpoint across both
# legacy privateClusterConfig and modern controlPlaneEndpointsConfig fields,
# while blocking external DNS endpoint traffic.

custom.gkeRequirePrivateControlPlane:
  display_name: Require private GKE control-plane endpoint
  description: Allows GKE clusters only when external DNS control-plane traffic is disabled and the control plane uses a private endpoint.
  action_type: ALLOW
  resource_types:
    - container.googleapis.com/Cluster
  method_types:
    - CREATE
    - UPDATE
  condition: >-
    (!has(resource.controlPlaneEndpointsConfig.dnsEndpointConfig) || resource.controlPlaneEndpointsConfig.dnsEndpointConfig.allowExternalTraffic == false) &&
    (
      (has(resource.privateClusterConfig) && resource.privateClusterConfig.enablePrivateEndpoint == true) ||
      (has(resource.controlPlaneEndpointsConfig.ipEndpointsConfig.enabled) && resource.controlPlaneEndpointsConfig.ipEndpointsConfig.enabled == false) ||
      (has(resource.controlPlaneEndpointsConfig.ipEndpointsConfig.enablePublicEndpoint) && resource.controlPlaneEndpointsConfig.ipEndpointsConfig.enablePublicEndpoint == false)
    )
