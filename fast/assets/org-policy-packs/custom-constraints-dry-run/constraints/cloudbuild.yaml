# Fail-closed ALLOW requiring Cloud Build private worker pools to disable public
# egress via peered-network egressOption or Private Service Connect settings.

custom.cloudBuildWorkerPoolNoPublicEgress:
  display_name: Disallow public egress on Cloud Build worker pools
  description: Allows Cloud Build private worker pools only when public egress and public IP addresses are disabled.
  action_type: ALLOW
  resource_types:
    - cloudbuild.googleapis.com/WorkerPool
  method_types:
    - CREATE
    - UPDATE
  condition: >-
    (has(resource.privatePoolV1Config.networkConfig) && resource.privatePoolV1Config.networkConfig.egressOption == 'NO_PUBLIC_EGRESS') ||
    (has(resource.privatePoolV1Config.privateServiceConnect) && (resource.privatePoolV1Config.privateServiceConnect.publicIpAddressDisabled == true || resource.privatePoolV1Config.privateServiceConnect.routeAllTraffic == true))
