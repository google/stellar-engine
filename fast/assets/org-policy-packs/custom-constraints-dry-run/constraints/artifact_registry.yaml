# Matches both the documented custom-constraint mode string ('REMOTE') and REST
# proto enum strings ('REMOTE_REPOSITORY', 'AOSS_REPOSITORY',
# 'ASSURED_OSS_REPOSITORY') because only resource.mode is supported in CEL.

custom.artifactRegistryDisallowRemoteRepos:
  display_name: Disallow Artifact Registry remote repositories
  description: Denies Artifact Registry repositories created in remote or upstream-proxy modes.
  action_type: DENY
  resource_types:
    - artifactregistry.googleapis.com/Repository
  method_types:
    - CREATE
  condition: "resource.mode in ['REMOTE', 'REMOTE_REPOSITORY', 'AOSS_REPOSITORY', 'ASSURED_OSS_REPOSITORY']"
