# Defense-in-depth guardrail blocking direct grants of high-privilege IAM roles
# to workload service accounts. Uses MemberTypeMatches for
# iam.googleapis.com/ServiceAccount (which excludes Google-managed service
# agents classified as iam.googleapis.com/ServiceAgent, such as
# @gcp-sa-*.iam.gserviceaccount.com and @cloudservices.gserviceaccount.com) and
# explicitly matches legacy Compute Engine (@developer.gserviceaccount.com) and
# App Engine (@appspot.gserviceaccount.com) default service accounts. Standard
# CEL string methods such as contains() are not supported on AllowPolicy fields.
# Scope enforcement to workload folders or projects after validating automation
# service account exceptions in dry-run.

custom.preventServiceAccountPrivilegeEscalation:
  display_name: Prevent service account privilege escalation
  description: >-
    Denies grants of selected high-privilege IAM roles to user-managed and
    legacy default service accounts while excluding Google-managed service
    agents. Intended for workload folders and projects after dry-run validation.
  action_type: DENY
  resource_types:
    - iam.googleapis.com/AllowPolicy
  method_types:
    - CREATE
    - UPDATE
  condition: >-
    resource.bindings.exists(
      binding,
      RoleNameMatches(
        binding.role,
        [
          'roles/owner',
          'roles/editor',
          'roles/iam.securityAdmin',
          'roles/resourcemanager.projectIamAdmin',
          'roles/iam.serviceAccountAdmin',
          'roles/iam.serviceAccountTokenCreator',
          'roles/orgpolicy.policyAdmin'
        ]
      ) &&
      binding.members.exists(
        member,
        MemberTypeMatches(
          member,
          ['iam.googleapis.com/ServiceAccount']
        ) ||
        MemberSubjectEndsWith(
          member,
          [
            'developer.gserviceaccount.com',
            'appspot.gserviceaccount.com'
          ]
        )
      )
    )
