# Denies Pub/Sub push subscriptions while leaving pull subscriptions allowed.
# Run in dry-run mode first to inventory active push endpoints before enforcing.

custom.pubsubDisallowPushSubscriptions:
  display_name: Disallow Pub/Sub push subscriptions
  description: Denies Pub/Sub subscriptions configured with a push endpoint while allowing pull subscriptions.
  action_type: DENY
  resource_types:
    - pubsub.googleapis.com/Subscription
  method_types:
    - CREATE
    - UPDATE
  condition: "has(resource.pushConfig.pushEndpoint) && resource.pushConfig.pushEndpoint != ''"
