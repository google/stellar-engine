# Denies BigQuery datasets that reference external data sources or catalogs.

custom.bigqueryDisallowExternalDatasets:
  display_name: Disallow external BigQuery datasets
  description: Denies BigQuery datasets that reference an external dataset or external catalog.
  action_type: DENY
  resource_types:
    - bigquery.googleapis.com/Dataset
  method_types:
    - CREATE
    - UPDATE
  condition: "has(resource.externalDatasetReference) || has(resource.externalCatalogDatasetOptions)"
