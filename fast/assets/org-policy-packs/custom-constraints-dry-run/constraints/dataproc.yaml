# Denies Dataproc cluster creation or update unless internalIpOnly is true.
# Note that UPDATE evaluates editable cluster parameters only and can block
# scaling pre-existing clusters that were created with external IP addresses.

custom.dataprocRequireInternalIp:
  display_name: Require private Dataproc clusters
  description: Denies Dataproc cluster creation or update unless the cluster uses internal IP addresses only.
  action_type: DENY
  resource_types:
    - dataproc.googleapis.com/Cluster
  method_types:
    - CREATE
    - UPDATE
  condition: "resource.config.gceClusterConfig.internalIpOnly != true"
