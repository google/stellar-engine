---
# Dry-run organization policy bindings for all 10 custom constraints in
# ../constraints/. Each key uses the "dry_run:" prefix consumed by
# modules/organization-se and modules/folder to populate dry_run_spec without
# blocking live traffic. Remove the "dry_run:" prefix one constraint at a time
# after dry-run telemetry and Policy Simulator verification pass.

dry_run:custom.artifactRegistryDisallowRemoteRepos:
  rules:
    - enforce: true

dry_run:custom.bigqueryDisallowExternalDatasets:
  rules:
    - enforce: true

dry_run:custom.cloudBuildWorkerPoolNoPublicEgress:
  rules:
    - enforce: true

dry_run:custom.composerRequirePrivateIp:
  rules:
    - enforce: true

dry_run:custom.composerRestrictWebServerAccess:
  rules:
    - enforce: true

dry_run:custom.dataprocRequireInternalIp:
  rules:
    - enforce: true

dry_run:custom.dnsDisallowPublicZones:
  rules:
    - enforce: true

dry_run:custom.gkeRequirePrivateControlPlane:
  rules:
    - enforce: true

dry_run:custom.preventServiceAccountPrivilegeEscalation:
  rules:
    - enforce: true

dry_run:custom.pubsubDisallowPushSubscriptions:
  rules:
    - enforce: true
