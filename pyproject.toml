[project]
name = "stellar-engine-tools"
version = "0.1.0"
description = "Repository tooling and root test suite for Stellar Engine."
requires-python = ">=3.14,<3.15"
dependencies = [
  "click>=8.5",
  "deepdiff>=9.1",
  "ghapi>=2.1",
  "iso8601>=2.1",
  "jsonschema>=4.26",
  "marko>=2.2",
  "pyyaml>=6.0",
  "requests>=2.34",
  "yamale>=6.1",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  # Pinned exactly so a new release cannot change formatting under CI.
  "ruff==0.17.1",
]
gem4gov = [
  "click>=8.5",
  "google-api-python-client>=2.201",
  "google-auth>=2.62",
  "google-auth-oauthlib>=1.5",
  "pyyaml>=6.0",
]

[tool.uv]
package = false
default-groups = ["dev", "gem4gov"]
