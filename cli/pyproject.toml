[project]
name = "stellar-engine-cli"
version = "0.1.0"
description = "Operator CLI that validates and guides Stellar Engine deployments."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "google-auth>=2.40",
  "google-cloud-billing>=1.16",
  "google-cloud-iam>=2.19",
  "google-cloud-org-policy>=1.14",
  "google-cloud-resource-manager>=1.14",
  "google-cloud-service-usage>=1.13",
  "google-cloud-storage>=3.1",
  "packaging>=25.0",
  "pydantic>=2.11",
  "python-dotenv>=1.1",
  "python-hcl2>=8.1",
  "pyyaml>=6.0",
  "questionary>=2.1",
  "requests>=2.32",
  "rich>=14.0",
  "ruamel-yaml>=0.18",
  "typer>=0.16",
]

[project.scripts]
stellar = "stellar_engine.cli:app"

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.4",
  "ruff>=0.12",
  "syrupy>=4.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stellar_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["terraform: runs the real terraform binary"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
  "B",
  "D",
  "E",
  "F",
  "I",
  "N",
  "PL",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = [
  # Typer commands expose many options by design.
  "PLR0913",
  "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing"]
