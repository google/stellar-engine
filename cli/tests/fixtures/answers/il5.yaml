# IL5 with an explicit KMS protection level that differs from the default.
prefix: il5
organization:
  id: "123456789012"
  domain: example.com
  customer_id: C01234567
billing:
  account_id: 000000-AAAAAA-BBBBBB
bootstrap_project: example-bootstrap
region: us-west1
compliance:
  regime: IL5
kms_protection_level: SOFTWARE
alert_email: alerts@example.com
logging:
  sink_type: pubsub
resman:
  tenants:
    mis:
      descriptive_name: Mission systems
