# Shaped like a lab org that pre-creates the Stage 0 projects: a shared
# billing account the deployer cannot administer, billing linkage under a
# human user, extra DRS principals, kept organization grants and imports.
prefix: lab1
organization:
  id: "123456789012"
  domain: example.com
  customer_id: C01234567
billing:
  account_id: 000000-AAAAAA-BBBBBB
  no_iam: true
billing_override:
  project: example-bootstrap
  billing_project: example-bootstrap
bootstrap_project: example-bootstrap
bootstrap_user: admin@example.com
region: us-east4
compliance:
  regime: IL5
alert_email: alerts@example.com
org_policies:
  allowed_policy_member_domains:
    - is:C0AAAAAAA
    - is:C0BBBBBBB
    - is:principalSet://iam.googleapis.com/organizations/123456789012
resman:
  tenants:
    ten1:
      descriptive_name: tenant-1
overrides:
  0-bootstrap:
    iam:
      roles/resourcemanager.projectCreator:
        - domain:example.com
      roles/owner:
        - user:admin@example.com
        - serviceAccount:deployer@example-bootstrap.iam.gserviceaccount.com
imports:
  0-bootstrap:
    module.automation-project.google_project.project[0]: lab1-prod-iac-core-0
    module.log-export-project.google_project.project[0]: lab1-prod-audit-logs-0
