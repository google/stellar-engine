# FedRAMP High with the sample defaults and two tenants.
prefix: frh
organization:
  id: "123456789012"
  domain: example.com
  customer_id: C01234567
billing:
  account_id: 000000-AAAAAA-BBBBBB
bootstrap_project: example-bootstrap
region: us-east4
compliance:
  regime: FEDRAMP_HIGH
alert_email: alerts@example.com
resman:
  tenants:
    ten1:
      descriptive_name: tenant-1
    ten2:
      descriptive_name: tenant-2
