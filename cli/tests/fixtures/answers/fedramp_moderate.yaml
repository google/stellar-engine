# FedRAMP Moderate with every optional Stage 0 input set.
prefix: frm
organization:
  id: "123456789012"
  domain: example.com
  customer_id: C01234567
billing:
  account_id: 000000-AAAAAA-BBBBBB
bootstrap_project: example-bootstrap
region: us-central1
compliance:
  regime: FEDRAMP_MODERATE
alert_email: alerts@example.com
essential_contacts: contacts@example.com
groups:
  gcp-devops: platform-devops
  gcp-organization-admins: gcp-organization-admins
logging:
  sink_type: storage
  retention_days: 400
budget:
  amount: 1000
org_policies:
  allowed_policy_member_domains:
    - C0AAAAAAA
resman:
  tenants:
    apps:
      descriptive_name: Applications
      admin_principal: group:apps-admins@example.com
      locations:
        gcs: us
        kms: us-central1
