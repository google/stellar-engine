# IL4 with a multi-region Assured Workloads location and custom envs.
prefix: il4
organization:
  id: "123456789012"
  domain: example.com
  customer_id: C01234567
billing:
  account_id: 000000-AAAAAA-BBBBBB
  is_org_level: false
bootstrap_project: example-bootstrap
region: us-east1
compliance:
  regime: IL4
  location: us
alert_email: alerts@example.com
essential_contacts:
  security@example.com:
    - SECURITY
    - TECHNICAL
  billing@example.com:
    - BILLING
logging:
  sink_type: bigquery
resman:
  envs:
    Prod:
      admin: prod-admins@example.com
    Dev: {}
  tenants:
    data:
      descriptive_name: Data platform
