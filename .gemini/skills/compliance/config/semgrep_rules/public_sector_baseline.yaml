rules:
  - id: python-weak-hash-algorithm
    message: >-
      Use of a weak or deprecated cryptographic hash algorithm (MD5 is
      non-FIPS-approved; SHA-1 is disallowed for digital signature generation
      and collision-resistant security authenticators per NIST SP 800-131A
      Rev. 2 and NIST SP 800-53 SC-13). Replace with SHA-256 or stronger. If
      the hash is genuinely non-security (e.g. a cache key), pass
      usedforsecurity=False explicitly.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-327", "CWE-328"]
      nist-800-53: ["SC-13"]
    # Semgrep resolves `import hashlib as hl` and `from hashlib import md5`
    # aliases against the qualified patterns, so arbitrary `$MOD.md5(...)`
    # receivers (which matched unrelated methods named md5) are not needed.
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: Crypto.Hash.MD5.new(...)
          - pattern: Crypto.Hash.SHA1.new(...)
          - pattern: Cryptodome.Hash.MD5.new(...)
          - pattern: Cryptodome.Hash.SHA1.new(...)
          - patterns:
              - pattern-either:
                  - pattern: hashlib.new($ALG, ...)
                  - pattern: hashlib.new(..., name=$ALG, ...)
              - metavariable-regex:
                  metavariable: $ALG
                  regex: (?i)^["'](md5|sha1|sha-1)["']$
      - pattern-not: hashlib.$F(..., usedforsecurity=False)

  - id: python-disabled-tls-verification
    message: >-
      TLS certificate verification is disabled. This defeats transmission
      confidentiality and integrity (NIST SP 800-53 SC-8, SC-23) and permits
      an active man-in-the-middle.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-295"]
      nist-800-53: ["SC-8", "SC-23"]
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: httpx.$METHOD(..., verify=False, ...)
      - pattern: httpx.Client(..., verify=False, ...)
      - pattern: httpx.AsyncClient(..., verify=False, ...)
      - pattern: $SESS.$METHOD(..., verify=False, ...)
      - pattern: $SESS.verify = False
      - pattern: urllib.request.urlopen(..., context=ssl._create_unverified_context(...), ...)
      - pattern: ssl._create_unverified_context(...)
      - pattern: |
          $CTX.verify_mode = ssl.CERT_NONE

  - id: python-os-command-injection
    message: >-
      Externally influenced input reaches an OS command executed through a
      shell. Pass an argument vector and set shell=False (NIST SP 800-53
      SI-10).
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      nist-800-53: ["SI-10"]
    patterns:
      - pattern-either:
          - pattern: os.system(...)
          - pattern: subprocess.$F(..., shell=True, ...)
          - pattern: os.popen(...)
      - pattern-not: os.system("...")
      - pattern-not: subprocess.$F("...", ..., shell=True, ...)
      - pattern-not: os.popen("...")

  - id: python-insecure-deserialization
    message: >-
      Deserializing untrusted data permits arbitrary code execution. Use
      yaml.safe_load / yaml.SafeLoader or a structured, schema-validated
      format such as JSON (NIST SP 800-53 SI-10).
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-502"]
      nist-800-53: ["SI-10"]
    patterns:
      - pattern-either:
          - pattern: pickle.load(...)
          - pattern: pickle.loads(...)
          - pattern: pickle.Unpickler(...).load()
          - pattern: yaml.load($X)
          - pattern: yaml.load($X, Loader=yaml.Loader)
          - pattern: yaml.load($X, Loader=yaml.UnsafeLoader)
          - pattern: yaml.load($X, Loader=yaml.FullLoader)
          - pattern: yaml.load($X, yaml.Loader)
          - pattern: yaml.load($X, yaml.UnsafeLoader)
          - pattern: yaml.load($X, yaml.FullLoader)
          - pattern: yaml.unsafe_load(...)
          - pattern: yaml.full_load(...)
          - pattern: marshal.load(...)
          - pattern: marshal.loads(...)
      - pattern-not: yaml.load($X, Loader=yaml.SafeLoader)
      - pattern-not: yaml.load($X, Loader=yaml.CSafeLoader)
      - pattern-not: yaml.load($X, yaml.SafeLoader)
      - pattern-not: yaml.load($X, yaml.CSafeLoader)

  - id: python-xxe-unsafe-xml-parser
    message: >-
      XML parsed with an unsafe or unhardened parser. While Python 3.7.1+
      Expat disables external entity expansion by default in stdlib XML
      modules, stdlib parsers remain vulnerable to XML entity expansion DoS
      (Billion Laughs / CWE-776) and lxml parsers with resolve_entities=True
      permit XXE disclosure and SSRF (CWE-611). Use defusedxml (NIST SP
      800-53 SI-10).
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-611", "CWE-776"]
      nist-800-53: ["SI-10"]
    pattern-either:
      - pattern: xml.etree.ElementTree.fromstring(...)
      - pattern: xml.etree.ElementTree.parse(...)
      - pattern: xml.dom.minidom.parse(...)
      - pattern: xml.dom.minidom.parseString(...)
      - pattern: xml.sax.parse(...)
      - pattern: xml.sax.parseString(...)
      - pattern: lxml.etree.fromstring(...)
      - pattern: lxml.etree.parse(...)
      - pattern: lxml.etree.XMLParser(..., resolve_entities=True, ...)

  - id: python-sql-injection-string-built-query
    message: >-
      SQL statement assembled by string formatting. Use parameterized queries
      (NIST SP 800-53 SI-10).
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      nist-800-53: ["SI-10"]
    # Deep expression matching (`<... ...>`) is required, not cosmetic: the
    # canonical injection is `"... WHERE id = '" + value + "'"`, whose outermost
    # operand is a BinOp rather than a literal. A shallow `"..." + $X` pattern
    # silently misses it.
    pattern-either:
      - pattern: $CURSOR.execute(<... "..." % $X ...>, ...)
      - pattern: $CURSOR.execute(<... "..." + $X ...>, ...)
      - pattern: $CURSOR.execute(<... "...".format(...) ...>, ...)
      - pattern: $CURSOR.execute(f"...{$X}...", ...)
      - pattern: $CURSOR.executemany(<... "..." % $X ...>, ...)
      - pattern: $CURSOR.executemany(<... "..." + $X ...>, ...)
      - pattern: $CURSOR.executemany(<... "...".format(...) ...>, ...)
      - pattern: $CURSOR.executemany(f"...{$X}...", ...)
      - patterns:
          - pattern-either:
              - pattern: $CURSOR.execute($Q, ...)
              - pattern: $CURSOR.executemany($Q, ...)
          - pattern-either:
              - pattern-inside: |
                  $Q = <... "..." % $X ...>
                  ...
              - pattern-inside: |
                  $Q = <... "..." + $X ...>
                  ...
              - pattern-inside: |
                  $Q = <... "...".format(...) ...>
                  ...
              - pattern-inside: |
                  $Q = f"...{$X}..."
                  ...

  - id: python-insecure-random-for-security
    message: >-
      The `random` module is not cryptographically secure and must not be used
      to generate tokens, keys, nonces, or passwords. Use `secrets` or
      `os.urandom` (NIST SP 800-53 SC-13).
    languages: [python]
    severity: WARNING
    metadata:
      cwe: ["CWE-338"]
      nist-800-53: ["SC-13"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: random.random(...)
              - pattern: random.randint(...)
              - pattern: random.choice(...)
              - pattern: random.choices(...)
              - pattern: random.randrange(...)
              - pattern: random.getrandbits(...)
          - pattern-inside: |
              def $FUNC(...):
                ...
          - metavariable-regex:
              metavariable: $FUNC
              regex: (?i)^(.*_)?(token|secret|key|nonce|salt|password|passwd|credential|otp|pin|reset_code|session_id)(_.*)?$
      - patterns:
          - pattern-either:
              - pattern: $VAR = <... random.random(...) ...>
              - pattern: $VAR = <... random.randint(...) ...>
              - pattern: $VAR = <... random.choice(...) ...>
              - pattern: $VAR = <... random.choices(...) ...>
              - pattern: $VAR = <... random.randrange(...) ...>
              - pattern: $VAR = <... random.getrandbits(...) ...>
          - metavariable-regex:
              metavariable: $VAR
              regex: (?i)^(.*_)?(token|secret|key|nonce|salt|password|passwd|credential|otp|pin|reset_code|session_id)(_.*)?$

  - id: python-hardcoded-credential-assignment
    message: >-
      Hardcoded credential in source. Store authenticators in Secret Manager
      and inject at runtime (NIST SP 800-53 IA-5).
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      nist-800-53: ["IA-5"]
    patterns:
      - pattern-either:
          - pattern: $VAR = "$VAL"
          - pattern: $OBJ.$VAR = "$VAL"
          - pattern: |
              {..., "$VAR": "$VAL", ...}
      # An exact-match anchor here caught only a bare `password = "..."`. Real
      # code writes `DB_PASSWORD`, `ADMIN_API_KEY`, `SERVICE_ACCOUNT_SECRET`, so
      # a qualifying prefix is permitted.
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)^([a-z0-9]+_)*(password|passwd|pwd|secret|token|api_token|access_token|api_key|apikey|access_key|secret_key|private_key|auth_token|bearer_token|client_secret)$
      - metavariable-regex:
          metavariable: $VAR
          regex: ^(?!.*(_ENV|_VAR|_NAME|_FIELD|_KEY_ID|_PATH|_FILE|_HEADER|_URL|_ENDPOINT|_TYPE)$).*$
      # Unpopulated scaffolding is not a leaked credential; reporting it as one
      # trains reviewers to ignore the rule.
      - metavariable-regex:
          metavariable: $VAL
          regex: (?i)^(?!$|changeme$|change_me$|placeholder$|redacted$|todo$|tbd$|none$|null$|xxx+$|csrf_token$|\[[^"']*\]$|<[^"']*>$|\$\{[^"']*\}$|%[sd]$).+
      - pattern-not: $VAR = os.environ[...]
      - pattern-not: $VAR = os.environ.get(...)
      - pattern-not: $VAR = os.getenv(...)

  - id: python-flask-debug-enabled
    message: >-
      Debug mode exposes an interactive console and must never be enabled in a
      production or accredited environment (NIST SP 800-53 CM-7, SI-11).
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-489"]
      nist-800-53: ["CM-7", "SI-11"]
    patterns:
      - pattern-either:
          - pattern: $APP.run(..., debug=True, ...)
          - pattern: $APP.config["DEBUG"] = True
          - pattern: $APP.debug = True
      - pattern-not: asyncio.run(...)

  - id: python-path-traversal-unvalidated-join
    message: >-
      Externally influenced input is joined into a filesystem path without
      confinement, permitting traversal outside the intended directory. Resolve
      the path and assert it stays within the boundary (NIST SP 800-53 AC-3,
      SI-10).
    languages: [python]
    severity: WARNING
    metadata:
      cwe: ["CWE-22"]
      nist-800-53: ["AC-3", "SI-10"]
    patterns:
      - pattern-either:
          - pattern: open(os.path.join(..., $REQ.$ANY, ...), ...)
          - pattern: open(os.path.join(..., $REQ.$ANY.get(...), ...), ...)
          - pattern: open(os.path.join(..., $REQ.$ANY[...], ...), ...)
          - pattern: open($REQ.$ANY, ...)
          - pattern: open($REQ.$ANY.get(...), ...)
          - pattern: open($REQ.$ANY[...], ...)
          - patterns:
              - pattern: open(os.path.join(..., $VAR, ...), ...)
              - pattern-either:
                  - pattern-inside: |
                      $VAR = $REQ.$ANY.get(...)
                      ...
                  - pattern-inside: |
                      $VAR = $REQ.$ANY[...]
                      ...
                  - pattern-inside: |
                      $VAR = $REQ.$ANY
                      ...
          - patterns:
              - pattern: open($PATH, ...)
              - pattern-either:
                  - pattern-inside: |
                      $VAR = $REQ.$ANY.get(...)
                      ...
                      $PATH = os.path.join(..., $VAR, ...)
                      ...
                  - pattern-inside: |
                      $VAR = $REQ.$ANY[...]
                      ...
                      $PATH = os.path.join(..., $VAR, ...)
                      ...
                  - pattern-inside: |
                      $VAR = $REQ.$ANY
                      ...
                      $PATH = os.path.join(..., $VAR, ...)
                      ...
                  - pattern-inside: |
                      $PATH = os.path.join(..., <... $REQ.$ANY ...>, ...)
                      ...
      - metavariable-regex:
          metavariable: $REQ
          regex: (?i)^(request|req|flask\.request)$

  - id: javascript-eval-of-dynamic-input
    message: >-
      Dynamic code evaluation permits arbitrary execution when the argument is
      influenced by untrusted input (NIST SP 800-53 SI-10).
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-95"]
      nist-800-53: ["SI-10"]
    pattern-either:
      - patterns:
          - pattern: eval($X)
          - pattern-not: eval("...")
      - pattern: new Function(...)
      - patterns:
          - pattern-either:
              - pattern: setTimeout($X, ...)
              - pattern: setInterval($X, ...)
          - pattern-not: setTimeout(function(...) { ... }, ...)
          - pattern-not: setTimeout((...) => ..., ...)
          - pattern-not: setTimeout("...", ...)
          - pattern-not: setInterval(function(...) { ... }, ...)
          - pattern-not: setInterval((...) => ..., ...)
          - pattern-not: setInterval("...", ...)

  - id: javascript-disabled-tls-verification
    message: >-
      TLS certificate verification is disabled, permitting an active
      man-in-the-middle (NIST SP 800-53 SC-8, SC-23).
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-295"]
      nist-800-53: ["SC-8", "SC-23"]
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = 0
      - pattern: $OPTS.rejectUnauthorized = false
      - pattern: |
          {..., rejectUnauthorized: false, ...}

  - id: go-disabled-tls-verification
    message: >-
      TLS certificate verification is disabled, permitting an active
      man-in-the-middle (NIST SP 800-53 SC-8, SC-23).
    languages: [go]
    severity: ERROR
    metadata:
      cwe: ["CWE-295"]
      nist-800-53: ["SC-8", "SC-23"]
    pattern-either:
      - pattern: |
          &tls.Config{..., InsecureSkipVerify: true, ...}
      - pattern: |
          tls.Config{..., InsecureSkipVerify: true, ...}
      - pattern: $CFG.InsecureSkipVerify = true

  - id: go-weak-hash-algorithm
    message: >-
      Use of a weak or deprecated cryptographic hash algorithm (MD5 is
      non-FIPS-approved; SHA-1 is disallowed for digital signature generation
      and collision-resistant security authenticators per NIST SP 800-131A
      Rev. 2 and NIST SP 800-53 SC-13).
    languages: [go]
    severity: ERROR
    metadata:
      cwe: ["CWE-327", "CWE-328"]
      nist-800-53: ["SC-13"]
    pattern-either:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
      - pattern: sha1.New()
      - pattern: sha1.Sum(...)
      - pattern: crypto.MD5.New()
      - pattern: crypto.SHA1.New()
