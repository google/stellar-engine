# skip boilerplate check
# This template is hydrated into customer ATO deliverables; a Google
# copyright header must not be stamped onto a customer's authorization
# artifact. See templates/PROVENANCE.md.

# ==============================================================================
# Security Control Traceability Matrix (SCTM) Technical & Operational Traceability
# Baseline: NIST SP 800-53 Rev. 5 / Public Sector & Regulated Cloud (FedRAMP, GovRAMP (formerly StateRAMP), DoD SRG)
# Note: Representative family summary; full 410-control FedRAMP High / DoD IL5
# baseline is hydrated in SCTM_Security_Control_Traceability_Matrix.xlsm and SSP.
# ==============================================================================

system_metadata:
  system_name: "{{ SYSTEM_NAME }}"
  system_abbreviation: "{{ SYSTEM_ABBREVIATION }}"
  impact_level: "{{ IMPACT_LEVEL }}"
  compliance_baseline: "{{ COMPLIANCE_BASELINE }}"
  governance_regime: "{{ GOVERNANCE_REGIME }}"
  version: "{{ VERSION }}"
  effective_date: "{{ DATE }}"
  discovered_codebase_metrics:
    total_gcp_apis_enabled: "{{ DISCOVERED_SERVICES_COUNT }}"
    total_terraform_modules_deployed: "{{ DISCOVERED_MODULES_COUNT }}"
    total_infrastructure_resources_scanned: "{{ DISCOVERED_RESOURCES_COUNT }}"
    primary_network_vpcs: "{{ NETWORK_VPCS }}"
    kms_cmek_keys_configured: "{{ KMS_KEYS }}"

overall_traceability_summary:
  total_baseline_controls: 410
  representative_summary_controls: 60
  status_vocabulary: ["Implemented", "Inherited", "Planned", "Not Applicable"]
  overall_compliance_percentage: "[CONFIG_REQUIRED: Overall Compliance Status — Pending SCA/3PAO Assessment]"

control_families:
  - family: "AC - Access Control"
    family_name: "Access Control"
    total_controls: 6
    implemented_iac: 5
    inherited_gcp: 0
    planned_rmf_manual: 1
    controls:
      - id: "AC-1"
        title: "Policy and Procedures"
        status: "Planned"
        implementation_details: "Documented in Access_Control_Policy_and_Procedures.md. Annual review required by ISSO/ISSM."
        codebase_evidence: "ato_artifacts/Policies_and_Procedures/Access_Control_Policy_and_Procedures.md"
      - id: "AC-2"
        title: "Account Management"
        status: "Implemented"
        implementation_details: "{{ IDENTITY_PROVIDER }} and Workload Identity Federation (WIF) configured via Terraform. Service accounts provisioned without static downloadable key files."
        codebase_evidence: "Discovered Service Accounts: {{ SERVICE_ACCOUNTS_LIST }}"
      - id: "AC-3"
        title: "Access Enforcement"
        status: "Implemented"
        implementation_details: "Least-privilege IAM roles and bindings assigned at Organization, Folder, and Project scopes."
        codebase_evidence: "{{ SEPARATION_OF_DUTIES_TABLE }}"
      - id: "AC-5"
        title: "Separation of Duties"
        status: "Implemented"
        implementation_details: "Administrative roles strictly partitioned into granular persona groups (Org Admin, Security Admin, Network Admin, Billing Admin, DevSecOps)."
        codebase_evidence: "IAM Roles Matrix extracted from IAM configuration files and Terraform IAM bindings."
      - id: "AC-6"
        title: "Least Privilege"
        status: "Implemented"
        implementation_details: "Curated GCP predefined and custom roles assigned. Automatic IAM role grant on default service account creation disabled by Organization Policy."
        codebase_evidence: "GCP Organization Policy constraint `iam.automaticIamGrantsForDefaultServiceAccounts` and curated roles."
      - id: "AC-17"
        title: "Remote Access"
        status: "Implemented"
        implementation_details: "Bastionless administrative access restricted via Identity-Aware Proxy (IAP) TCP tunneling (where configured) and Private Google Access."
        codebase_evidence: "VPC Service Controls perimeters and IAP SSH/RDP access rules."

