# skip boilerplate check
# This template is hydrated into customer ATO deliverables; a Google
# copyright header must not be stamped onto a customer's authorization
# artifact. See templates/PROVENANCE.md.

# ==============================================================================
# Hardware and Software Inventory Template (NIST SP 800-53 Rev. 5 / Public Sector Baseline)
# Derived from Public Sector and Federal HWSW Inventory Templates
# ==============================================================================

system_metadata:
  system_name: "{{ SYSTEM_NAME }}"
  system_abbreviation: "{{ SYSTEM_ABBREVIATION }}"
  impact_level: "{{ IMPACT_LEVEL }}"
  compliance_baseline: "{{ COMPLIANCE_BASELINE }}"
  organization: "{{ ORGANIZATION }}"
  effective_date: "{{ DATE }}"
  document_version: "{{ VERSION }}"
  primary_gcp_location: "{{ PRIMARY_LOCATION }}"
  ditpr_emass_id: "DITPR-{{ SYSTEM_ABBREVIATION }}-001"

personnel_contacts:
  system_owner:
    name: "{{ SO_NAME }}"
    email: "{{ SO_EMAIL }}"
    phone: "{{ SO_PHONE }}"
  isso_poc:
    name: "{{ ISSO_NAME }}"
    email: "{{ ISSO_EMAIL }}"
    phone: "{{ ISSO_PHONE }}"

# ------------------------------------------------------------------------------
# 1. Hardware Assets Inventory (Single Schema Entry for Recursive Expansion)
# ------------------------------------------------------------------------------
hardware_assets:
  - id: "1.0"
    component_type: "{{ ASSET_COMPONENT_TYPE }}"
    asset_name: "{{ ASSET_NAME }}"
    nickname: "{{ ASSET_NICKNAME }}"
    asset_ip_address: "{{ ASSET_IP_ADDRESS }}"
    public_facing: "{{ ASSET_PUBLIC_FACING }}"
    public_facing_fqdn: "{{ ASSET_PUBLIC_FACING_FQDN }}"
    public_facing_ip: "{{ ASSET_PUBLIC_FACING_IP }}"
    public_facing_urls: "{{ ASSET_PUBLIC_FACING_URLS }}"
    virtual_asset: "{{ ASSET_VIRTUAL_ASSET }}"
    manufacturer: "{{ ASSET_MANUFACTURER }}"
    model_number: "{{ ASSET_MODEL_NUMBER }}"
    serial_number: "{{ ASSET_SERIAL_NUMBER }}"
    os_fw_version: "{{ ASSET_OS_FW_VERSION }}"
    memory_size_type: "{{ ASSET_MEMORY_SIZE_TYPE }}"
    location: "{{ PRIMARY_LOCATION }}"
    approval_status: "{{ ASSET_APPROVAL_STATUS }}"
    critical_asset: "{{ ASSET_CRITICAL_ASSET }}"

# ------------------------------------------------------------------------------
# 2. Software Assets Inventory (Single Schema Entry for Recursive Expansion)
# ------------------------------------------------------------------------------
software_and_services_inventory:
  software_assets:
    - id: "1"
      category: "{{ SOFTWARE_CATEGORY }}"
      software_name: "{{ SOFTWARE_NAME }}"
      vendor: "{{ SOFTWARE_VENDOR }}"
      version: "{{ SOFTWARE_VERSION }}"
      installation_path: "{{ SOFTWARE_INSTALLATION_PATH }}"
      license_type: "{{ SOFTWARE_LICENSE_TYPE }}"
      purpose: "{{ SOFTWARE_PURPOSE }}"
      data_classification: "{{ SOFTWARE_DATA_CLASSIFICATION }}"
      patched_date: "{{ DATE }}"
      approval_status: "Approved"

  enabled_gcp_cloud_services:
    {{ GCP_SERVICES_ENABLED }}

  service_accounts:
    {{ SERVICE_ACCOUNTS_LIST }}

rmf_team_manual_action:
  callout: "> [!IMPORTANT] **RMF TEAM ACTION REQUIRED**: Perform annual physical asset audits for local client workstations and confirm {{ RMF_GOVERNANCE_SYSTEM }} asset inventory serial numbers."
