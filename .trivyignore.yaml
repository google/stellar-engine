misconfigurations:
  - id: GCP-0007
    paths:
      - "modules/gcs/iam.tf"
      - "modules/project/iam.tf"
    statement: "google_storage_bucket_iam_binding.authoritative scopes IAM bindings to individual buckets, and google_project_iam_binding.authoritative grants privileged roles only to dedicated Terraform bootstrap and resource-management automation service accounts."
  - id: AVD-GCP-0007
    paths:
      - "modules/gcs/iam.tf"
      - "modules/project/iam.tf"
    statement: "google_storage_bucket_iam_binding.authoritative scopes IAM bindings to individual buckets, and google_project_iam_binding.authoritative grants privileged roles only to dedicated Terraform bootstrap and resource-management automation service accounts."
  - id: GCP-0015
    paths:
      - "modules/cloudsql-instance/main.tf"
    statement: "Reusable cloudsql-instance module exposes configurable TLS enforcement via var.ssl.mode and defaults public_ipv4 to false, restricting connections to Private Services Access VPC peering."
  - id: AVD-GCP-0015
    paths:
      - "modules/cloudsql-instance/main.tf"
    statement: "Reusable cloudsql-instance module exposes configurable TLS enforcement via var.ssl.mode and defaults public_ipv4 to false, restricting connections to Private Services Access VPC peering."
  - id: GCP-0043
    paths:
      - "modules/compute-vm/main.tf"
    statement: "can_ip_forward defaults to false in modules/compute-vm and is only set to true on Network Virtual Appliance (NVA) and next-hop gateway router instances that require packet forwarding."
  - id: AVD-GCP-0043
    paths:
      - "modules/compute-vm/main.tf"
    statement: "can_ip_forward defaults to false in modules/compute-vm and is only set to true on Network Virtual Appliance (NVA) and next-hop gateway router instances that require packet forwarding."
  - id: GCP-0057
    paths:
      - "modules/gke-cluster-standard/main.tf"
      - "modules/gke-cluster-standard-se/main.tf"
    statement: "Both GKE modules enable Workload Identity (workload_pool) by default, which enforces GKE_METADATA on nodes, and delete the temporary initial default node pool (remove_default_node_pool = true)."
  - id: AVD-GCP-0057
    paths:
      - "modules/gke-cluster-standard/main.tf"
      - "modules/gke-cluster-standard-se/main.tf"
    statement: "Both GKE modules enable Workload Identity (workload_pool) by default, which enforces GKE_METADATA on nodes, and delete the temporary initial default node pool (remove_default_node_pool = true)."
