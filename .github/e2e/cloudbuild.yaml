timeout: 7200s
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _TRIGGER: "workflow_dispatch"
  _REGIMES: ""
  _CI_PROJECT_ID: ""
  _SHORT_SHA: "local"

steps:
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "sync-warm-baseline"
    entrypoint: "bash"
    env:
      - "TRIGGER=${_TRIGGER}"
      - "REGIMES=${_REGIMES}"
      - "CI_PROJECT_ID=${_CI_PROJECT_ID}"
      - "SHORT_SHA=${_SHORT_SHA}"
    args:
      - ".github/e2e/run-baseline-lifecycle.sh"
