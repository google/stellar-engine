# Type and Framework are independent: a blueprints/fedramp-high/ change gets both.

"Scope - Module":
  - changed-files:
      - any-glob-to-any-file: 'modules/**'

"Scope - Fast":
  - changed-files:
      - any-glob-to-any-file:
          - 'fast/**'
          - 'scripts/**'
          - 'cli/**'

"Scope - Blueprint":
  - changed-files:
      - any-glob-to-any-file: 'blueprints/**'

"Documentation":
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'

"Framework - FedRAMP Moderate":
  - changed-files:
      - any-glob-to-any-file: 'blueprints/fedramp-moderate/**'

"Framework - FedRAMP High":
  - changed-files:
      - any-glob-to-any-file: 'blueprints/fedramp-high/**'

"Framework - IL4":
  - changed-files:
      - any-glob-to-any-file: 'blueprints/il4/**'

"Framework - IL5":
  - changed-files:
      - any-glob-to-any-file: 'blueprints/il5/**'

"Gemini - Enterprise":
  - changed-files:
      - any-glob-to-any-file:
          - '**/*gemini-enterprise*/**'
          - '**/*gemini-enterprise*'
          - '**/*gemini_enterprise*/**'
          - '**/*gemini_enterprise*'
  - head-branch:
      - '^.*gemini[-_]?enterprise.*$'

"Gemini - Government":
  - changed-files:
      - any-glob-to-any-file:
          - '**/*gem4gov*/**'
          - '**/*gem4gov*'
          - '**/*g4g*/**'
          - '**/*g4g*'
          - '**/*gemini-for-government*/**'
          - '**/*gemini-for-government*'
          - '**/*gemini_for_government*/**'
          - '**/*gemini_for_government*'
  - head-branch:
      - '^.*(gem4gov|g4g|gemini[-_]?for[-_]?government).*$'
