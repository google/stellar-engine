# PR labels are applied along two independent dimensions, so a PR can carry
# both a Type and a Framework label (e.g. a change under
# blueprints/fedramp-high/ receives "Type - Blueprint" AND
# "Framework - FedRAMP High").

# --- Type: which top-level area of the repo the PR touches ---

"Type - Modules":
  - changed-files:
      - any-glob-to-any-file: 'modules/**'

"Type - Fast":
  - changed-files:
      - any-glob-to-any-file: 'fast/**'

"Type - Blueprint":
  - changed-files:
      - any-glob-to-any-file: 'blueprints/**'

# --- Framework: which compliance framework the PR relates to ---

"Framework - FedRAMP High":
  - changed-files:
      - any-glob-to-any-file: 'blueprints/fedramp-high/**'

"Framework - FedRAMP IL5":
  - changed-files:
      - any-glob-to-any-file: 'blueprints/il5/**'
