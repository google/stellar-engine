name: "Pull Request Labeler"

# pull_request_target so fork PRs get labelled; on pull_request their token is
# read-only. Safe only because this job never checks out or runs PR code.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Run Labeler
    runs-on: ubuntu-latest
    steps:
      - name: Apply PR Labels
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
