name: "Pull Request Labeler"

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Run Labeler
    runs-on: ubuntu-latest
    steps:
      - name: Apply PR Labels
        uses: actions/labeler@8558b10900143869fc2c4a0e1183070497b7188c # v5.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
