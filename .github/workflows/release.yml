name: Auto

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    if: github.repository == 'google/stellar-engine'
    runs-on: ubuntu-latest
    env:
      GEMINI_WIF_ENABLED: ${{ secrets.WIF_PROVIDER != '' && secrets.GEMINI_WIF_SERVICE_ACCOUNT != '' && secrets.GEMINI_PROJECT_ID != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to GCP via WIF for Gemini
        id: gcp-auth
        if: github.ref == 'refs/heads/main' && env.GEMINI_WIF_ENABLED == 'true'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GEMINI_WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Configure Release Please
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          GEMINI_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          GEMINI_PROJECT_ID: ${{ secrets.GEMINI_PROJECT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/release_please.py prepare

      - name: Generate Release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: main

      - name: Ensure Curated Release PR Labels
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/release_please.py label-pr

      - name: On Release Created
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "Successfully published release: $TAG_NAME"
