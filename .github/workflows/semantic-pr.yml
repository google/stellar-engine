name: "Lint Pull Request"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Validating PR title: $PR_TITLE"

          # Only feat and fix reach the CHANGELOG, which is what gates a release.
          # 'release' is reserved for Release Please's own PR.
          RELEASING="feat|fix"
          SILENT="docs|style|refactor|test|build|ci|chore"
          SCOPE="\([a-zA-Z0-9_/.-]+\)"
          FORMAT="^($RELEASING|$SILENT|release)($SCOPE)?!?: .+$"

          if [[ ! "$PR_TITLE" =~ $FORMAT ]]; then
            echo "::error::PR title must follow Conventional Commits: <type>(<scope>): <description>"
            echo "Types: $RELEASING | $SILENT"
            echo "Example: feat(modules/kms): add HSM protection support"
            exit 1
          fi

          echo "PR title OK"
