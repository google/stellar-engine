name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Run tfsec
        uses: aquasecurity/tfsec-pr-commenter-action@7a44c5dcde5dfab737363e391800629e27b6376b
        with:
          tfsec_args: --soft-fail
          github_token: ${{ github.token }}

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        with:
          sarif_file: 'trivy-results.sarif'

  shell-tests:
    name: Shell Script Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Run Shell Script Test Suites
        run: |
          bash tests/scripts/run_shell_tests.sh

  tflint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
          checksums: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537

      - name: Test TFLint Runner
        run: |
          bash tests/scripts/test_tflint.sh

      - name: Run TFLint
        run: |
          bash tools/tflint.sh -f compact

  python-tests:
    name: Python Unit Tests & Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Python Lint and CodeQL py/unused-local-variable Check (ruff)
        run: |
          uv run --locked ruff check .

      - name: Python Formatting Check (ruff)
        run: |
          uv run --locked ruff format --check .

      - name: Run Python Unit Tests
        run: |
          uv run --locked pytest

  cli-tests:
    name: Stellar CLI Tests & Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Check license headers
        run: uv run --locked python ../tools/check_boilerplate.py src tests

      - name: Check formatting (ruff format)
        run: uv run ruff format --check

      - name: Lint (ruff check)
        run: uv run ruff check

      - name: Type check (pyright)
        run: uv run pyright

      - name: Run unit tests
        run: uv run pytest
