# Dependabot opens pull requests for pinned versions, so CI validates each
# update before it merges.
#
# - Every entry waits 14 days after a release, which keeps updates in line
#   with the repository rule to pick versions at least two weeks old.
#   Security updates skip this wait.
# - Minor and patch updates arrive as one grouped pull request per entry.
#   Major updates arrive one per pull request.
# - Commit prefixes produce titles such as "ci(deps): bump ..." that pass
#   the semantic-pr.yml title check.
# - Each entry sets its Dependencies - <Ecosystem> label, while the labeler.yml
#   workflow applies the curated scope and framework labels by path.
# - Terraform provider versions stay out of scope. The default-versions.tf
#   file sets them for every versions.tf copy at once, and tools/lint.sh
#   expects the copies to match it.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "Dependencies - GitHub Actions"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/cli"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "Dependencies - Python"
    groups:
      uv:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/blueprints/gemini-enterprise/analytics"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "Dependencies - Docker"

  - package-ecosystem: "npm"
    directory: "/blueprints/fedramp-high/cloud-functions/src-code"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "Dependencies - JavaScript"
