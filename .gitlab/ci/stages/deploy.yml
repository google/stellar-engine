  rules:
    - if: '$CI_COMMIT_TAG =~ /^org\/v/'
      when: never
    - if: '$DEPLOY_STAGES =~ /\b1\b/'
      when: on_success 
    - when: never

compliance-check:
  stage: compliance
  environment:
    name: $ENV_NAME
  image: 
    name: hashicorp/terraform:latest
    entrypoint: [""]
  variables:
    TF_DIR: "fast/stages-aw/1-assured-workload"
  before_script:
    - apk add --no-cache yq bash jq
    - cd ${TF_DIR}
    - terraform init -backend=false
  script:
    - cd ${CI_PROJECT_DIR}/automation
    - ./allow_compliance.sh
  artifacts:
    name: "${CI_JOB_NAME}"
    paths:
      - "${TF_DIR}/tfplan"
    expire_in: 1 hours
  rules:
    - if: '$CI_COMMIT_TAG =~ /^org\/v/'
      when: never
    - if: '$DEPLOY_STAGES =~ /\b1\b/'
      when: on_success
    - when: never

apply-1-assured-workload:
  stage: 1-apply
  extends: .terraform_apply_template
  environment:
    name: $ENV_NAME
  variables:
    TF_DIR: "fast/stages-aw/1-assured-workload"
    GCP_SERVICE_ACCOUNT: "${PREFIX}-prod-bootstrap-1@${PREFIX}-il5-iac.iam.gserviceaccount.com"
  before_script:
    - !reference [.stage-1-before-script, before_script]
    - !reference [.tf_dependencies, before_script]
    - terraform init
  rules:
    - if: '$CI_COMMIT_TAG =~ /^org\/v/'
      when: never
    - if: '$DEPLOY_STAGES =~ /\b1\b/'
      when: manual
    - when: never

