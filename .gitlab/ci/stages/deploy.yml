# Targeted apply stage 3 ngfw

targeted-plan-3-networking:
  stage: target-3-plan
  environment:
    name: $ENV_NAME
  image: google/cloud-sdk:latest
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "${CI_SERVER_URL}"
  variables:
    TF_DIR: "fast/stages-aw/3-networking"
    GCP_SERVICE_ACCOUNT: "${PREFIX}-prod-resman-net-1@${PREFIX}-il5-iac.iam.gserviceaccount.com"
  before_script:
    - !reference [.stage-3-before-script, before_script]
    - !reference [.tf_dependencies, before_script]
    - terraform init
  script:
    - terraform plan -target="google_cloud_quotas_quota_preference.network_quota" -target="google_project_iam_custom_role.ngfw-custom-role" -target="local_file.generated_ingress_rule" -out=tfplan
  artifacts:
    name: "${CI_JOB_NAME}"
    paths:
      - "${TF_DIR}/tfplan"
      - "${TF_DIR}/data/**/*.yaml"
      - "${TF_DIR}/data/hierarchical-ingress-rules.yaml"
    expire_in: 3 hours
  rules:
    - if: '$CI_COMMIT_TAG =~ /^org\/v/'
      when: never
    - if: '$DEPLOY_STAGES =~ /\b3-targeted\b/'
      when: on_success
    - when: never

targeted-apply-3-networking:
  stage: target-3-apply
  extends: .terraform_apply_template
  environment:
    name: $ENV_NAME
  variables:
    TF_DIR: "fast/stages-aw/3-networking"
    GCP_SERVICE_ACCOUNT: "${PREFIX}-prod-resman-net-1@${PREFIX}-il5-iac.iam.gserviceaccount.com"
  before_script:
    - !reference [.stage-3-before-script, before_script]
    - !reference [.tf_dependencies, before_script]
    - terraform init
  rules:
    - if: '$CI_COMMIT_TAG =~ /^org\/v/'
      when: never
    - if: '$DEPLOY_STAGES =~ /\b3-targeted\b/'
      when: manual
    - when: never

