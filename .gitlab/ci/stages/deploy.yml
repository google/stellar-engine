stages:
  - image-auth
  - 0-plan
  - 0-apply
  - 1-plan
  - compliance
  - 1-apply
  - 2-plan
  - 2-apply
  - target-3-plan
  - target-3-apply
  - 3-plan
  - 3-apply
  - 3-vpn-plan
  - 3-vpn-apply
  - 4-plan
  - 4-apply
  - skip

stages-bypass-gate:
  stage: skip
  environment:
    name: $ENV_NAME
  script:
    - echo "No infrastructure modules (0-4) were requested in DEPLOY_STAGES ('$DEPLOY_STAGES')."
    - echo "Skipping this child pipeline."
  rules:
    - if: '$DEPLOY_STAGES !~ /\b(0|1|2|3|4)\b/'
      when: on_success
    - when: never

include:
 - local: '.gitlab/ci/templates/templates.yml'
 - local: '.gitlab/ci/templates/stage_templates.yml'
 - local: '.gitlab/ci/templates/tf_dependencies_public.yml'
   rules:
    - if: $GCP_TF_REGISTRY_TYPE == "PUBLIC" || $GCP_TF_REGISTRY_TYPE == null || $GCP_TF_REGISTRY_TYPE == ""
 - local: '.gitlab/ci/templates/tf_dependencies_internal.yml'
   rules:
    - if: $GCP_TF_REGISTRY_TYPE == "PRIVATE_DW"

# Stage-0 org bootstrap plan/apply stages

plan-0-org-bootstrap:
  stage: 0-plan
  extends: .terraform_plan_template
  environment:
    name: $ENV_NAME
  variables:
    TF_DIR: "fast/stages-aw/0-organization-bootstrap"
    GCP_SERVICE_ACCOUNT: "${PREFIX}-prod-bootstrap-1@${PREFIX}-il5-iac.iam.gserviceaccount.com"
  before_script:
    - export GOOGLE_IMPERSONATE_SERVICE_ACCOUNT="${PREFIX}-prod-bootstrap-0@${PREFIX}-il5-iac.iam.gserviceaccount.com"
    - !reference [.stage-0-before-script, before_script]
    - !reference [.tf_dependencies, before_script]
    - terraform init
  rules:
    - if: '$CI_COMMIT_TAG =~ /^org\/v/'
      when: on_success
    - if: '$DEPLOY_STAGES =~ /\b0\b/'
      when: on_success
    - when: never

apply-0-org-bootstrap:
  stage: 0-apply
  extends: .terraform_apply_template
  environment:
    name: $ENV_NAME
  variables:
    TF_DIR: "fast/stages-aw/0-organization-bootstrap"
    GCP_SERVICE_ACCOUNT: "${PREFIX}-prod-bootstrap-1@${PREFIX}-il5-iac.iam.gserviceaccount.com"
  before_script:
    - export GOOGLE_IMPERSONATE_SERVICE_ACCOUNT="${PREFIX}-prod-bootstrap-0@${PREFIX}-il5-iac.iam.gserviceaccount.com"
    - !reference [.stage-0-before-script, before_script]
    - !reference [.tf_dependencies, before_script]
    - terraform init
  rules: 
    - if: '$CI_COMMIT_TAG =~ /^org\/v/'
      when: manual
    - if: '$DEPLOY_STAGES =~ /\b0\b/'
      when: manual 
    - when: never

