apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: flash-gateway
  namespace: flash
  annotations:
    networking.gke.io/certmap: flash-cert-map
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  - name: https
    protocol: HTTPS
    port: 443
    allowedRoutes:
      namespaces:
        from: Same
