name: "oauth2_generic"
label: "Keycloak" # This is the text on the button in the login screen
app_id: "gitlab" # The Client ID from Keycloak
app_secret: "" # Paste the secret you copied
args:
  client_options:
    site: "" # Your Keycloak URL
    user_info_url: "/realms/YOUR_REALM_NAME/protocol/openid-connect/userinfo"
    authorize_url: "/realms/YOUR_REALM_NAME/protocol/openid-connect/auth"
    token_url: "/realms/YOUR_REALM_NAME/protocol/openid-connect/token"
  scope: "openid profile email"
  user_response_structure:
    root_path: []
    id_path: "sub"
    attributes:
      email: "email"
      name: "name"
      nickname: "preferred_username"